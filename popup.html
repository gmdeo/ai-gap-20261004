<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context Craft</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #1a1a1a;
      background: #ffffff;
    }

    .popup-container {
      padding: 16px;
    }

    .header {
      margin-bottom: 16px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #1a1a1a;
    }

    .tagline {
      font-size: 13px;
      color: #6b7280;
    }

    .status {
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 13px;
      color: #6b7280;
    }

    .status-value {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .status-value.active {
      color: #10b981;
    }

    .status-value.archived {
      color: #6b7280;
    }

    .instructions {
      padding: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .instructions-title {
      font-size: 13px;
      font-weight: 600;
      color: #1e40af;
      margin-bottom: 8px;
    }

    .instructions-text {
      font-size: 13px;
      color: #1e3a8a;
      line-height: 1.6;
    }

    .cta-button {
      width: 100%;
      padding: 10px 16px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .cta-button:hover {
      background: #2563eb;
    }

    .cta-button:active {
      background: #1d4ed8;
    }

    .footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      text-align: center;
    }

    .footer-link {
      font-size: 12px;
      color: #6b7280;
      text-decoration: none;
    }

    .footer-link:hover {
      color: #3b82f6;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1>Context Craft</h1>
      <p class="tagline">Take control of what your AI remembers</p>
    </div>

    <div class="status">
      <div class="status-row">
        <span class="status-label">Active Messages</span>
        <span class="status-value active" id="activeCount">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Archived Messages</span>
        <span class="status-value archived" id="archivedCount">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Estimated Tokens</span>
        <span class="status-value" id="tokenCount">—</span>
      </div>
    </div>

    <div class="instructions">
      <div class="instructions-title">How to use</div>
      <div class="instructions-text">
        Open ChatGPT or Claude. A sidebar will appear showing your conversation. Toggle messages on/off to control what the AI remembers.
      </div>
    </div>

    <button class="cta-button" id="openChatButton">Open ChatGPT</button>

    <div class="footer">
      <a href="https://gmdeo-context-craft.vercel.app" class="footer-link" target="_blank">Learn more</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
